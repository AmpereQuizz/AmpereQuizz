name: Publier le site

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Seule la branche par défaut du dépôt est publiée.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Récupérer les images Wikipédia / Wikimedia Commons manquantes
        run: node scripts/fetch-images.mjs

      - name: Enregistrer les images récupérées dans le dépôt
        run: |
          if [ -n "$(git status --porcelain lists)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lists
            git commit -m "Images récupérées automatiquement depuis Wikimedia Commons"
            git push
          fi

      - name: Construire l'index des listes
        run: node scripts/build-index.mjs

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r index.html css js lists _site/
          touch _site/.nojekyll
          # Numéro de version dans les adresses des fichiers : le navigateur charge
          # forcément la nouvelle version après chaque publication (pas de vieux cache).
          V=${GITHUB_SHA::8}
          sed -i -E "s#(from '\./[A-Za-z0-9_-]+\.js)'#\1?v=$V'#g" _site/js/*.js
          sed -i -E "s#(src=\"js/app\.js)\"#\1?v=$V\"#; s#(href=\"css/style\.css)\"#\1?v=$V\"#" _site/index.html
          grep -q "app.js?v=$V" _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
